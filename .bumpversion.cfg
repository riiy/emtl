[bumpversion]
current_version = 0.3.0a1
commit = False
tag = False
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(?:(?P<pre>a|b|rc)(?P<num>\d+))?
serialize =
    {major}.{minor}.{patch}{pre}{num}
    {major}.{minor}.{patch}

[bumpversion:part:pre]
optional_value = final
values =
    a
    b
    rc
    final

[bumpversion:part:num]
first_value = 1

[bumpversion:file:setup.py]
search = "fallback_version": "{current_version}"
replace = "fallback_version": "{new_version}"

[bumpversion:file:docs/conf.py]
search = version = release = "{current_version}"
replace = version = release = "{new_version}"

[bumpversion:file:src/emtl/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:.cookiecutterrc]
search = version: "{current_version}"
replace = version: "{new_version}"
