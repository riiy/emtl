[testenv:bootstrap]
deps =
    jinja2
    tox
skip_install = true
commands =
    python ci/bootstrap.py --no-env
passenv =
    TOXPYTHON
    PYTEST_ADDOPTS

; a generative tox configuration, see: https://tox.wiki/en/latest/user_guide.html#generative-environments
[tox]
minversion = 4.67
envlist =
    clean,
    check,
    docs,
    {py311}-{cover},
    report
ignore_basepython_conflict = true

[testenv]
basepython =
    py311: {env:TOXPYTHON:python3.11}
    {bootstrap,clean,check,report,docs,codecov}: {env:TOXPYTHON:python3}
setenv =
    PYTHONPATH={toxinidir}
    PYTHONUNBUFFERED=yes
    EM_USERNAME=
    EM_PASSWORD=
passenv =
    TOXPYTHON
    PYTEST_ADDOPTS
; tox adds these credential-related defaults even with an explicit passenv.
disallow_pass_env =
    EM_*
    NETRC
    SSH_AUTH_SOCK
    SSH_AGENT_PID
usedevelop =
    cover: true
deps =
    pytest
    cover: pytest-cov
commands =
    cover: {posargs:pytest --cov --cov-report=term-missing --cov-report=xml -vv}
commands_pre =
    cover: python ci/check_test_environment.py

[testenv:check]
deps =
    docutils
    pre-commit
    readme-renderer
    pygments
    isort
    setuptools-scm
skip_install = true
commands =
    python setup.py check --strict --metadata --restructuredtext
    pre-commit run --all-files --show-diff-on-failure

[testenv:docs]
usedevelop = true
deps =
    -r{toxinidir}/docs/requirements.txt
commands =
    sphinx-build {posargs:-E} -b html docs dist/docs
    sphinx-build -b linkcheck docs dist/docs

[testenv:report]
deps =
    coverage
skip_install = true
commands =
    coverage report
    coverage html

[testenv:clean]
commands =
    python setup.py clean
    coverage erase
skip_install = true
deps =
    coverage
[pkgenv]
pass_env =
    SETUPTOOLS_SCM_PRETEND_VERSION_FOR_EMTL
